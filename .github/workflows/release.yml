name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build and publish
        run: dotnet publish src/Tenere.App/Tenere.App.csproj -c Release -r win-x64 --self-contained true -o publish

      - name: Build installer
        run: |
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' installer\Tenere.iss /DMyAppVersion=${{ github.ref_name }}
        shell: pwsh

      - name: Create portable archive
        run: Compress-Archive -Path publish\* -DestinationPath tenere-portable.zip
        shell: pwsh

      - name: Generate checksums
        run: |
          Get-ChildItem installer\Output\*.exe, tenere-portable.zip |
            ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash)  $($_.Name)" } |
            Out-File -Encoding utf8 checksums.sha256
        shell: pwsh

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer/Output/*.exe
            tenere-portable.zip
            checksums.sha256
          generate_release_notes: true